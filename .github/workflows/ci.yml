name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest
      - name: Frontend test and build
        working-directory: frontend
        run: |
          npm test -- --run
          npm run build
          if [[ -n "$(git status --porcelain -- ../src/receipt_bench/demo/static)" ]]; then
            echo "Frontend source and committed production assets are out of sync."
            git status --short -- ../src/receipt_bench/demo/static
            exit 1
          fi
      - name: Build Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Validate deployment package
        run: python infra/scripts/stage-package.py --dry-run
