schema_path: schemas/expense-receipt.schema.json
dataset_manifest: data/manifests/benchmark.jsonl
output_root: results/runs
concurrency: 1
warmup_requests: 2
random_seed: 20260828
retry:
  max_attempts: 3
  initial_delay_seconds: 1
  max_delay_seconds: 30
solutions:
  - id: gpt-5.6-sol
    kind: direct
    deployment: receipt-gpt-56-sol
    model: gpt-5.6-sol
    api: azure-openai
    reasoning_effort: low
  - id: gpt-5.6-terra
    kind: direct
    deployment: receipt-gpt-56-terra
    model: gpt-5.6-terra
    api: azure-openai
    reasoning_effort: low
