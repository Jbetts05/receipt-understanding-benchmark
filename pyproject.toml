[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "receipt-understanding-benchmark"
version = "0.2.0"
description = "Self-deployable receipt extraction laboratory for Foundry models and Azure services."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Josh Betts" }]
dependencies = [
  "aiohttp>=3.12,<4",
  "anthropic>=0.67,<1",
  "azure-ai-documentintelligence>=1.0,<2",
  "azure-ai-vision-imageanalysis>=1.0,<2",
  "azure-core>=1.35,<2",
  "azure-data-tables>=12.7,<13",
  "azure-identity>=1.25,<2",
  "azure-keyvault-secrets>=4.10,<5",
  "azure-storage-blob>=12.27,<13",
  "azure-storage-queue>=12.14,<13",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.25,<5",
  "openai>=2.0,<3",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dateutil>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "rapidfuzz>=3.13,<4",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
receipt-bench = "receipt_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_bench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["receipt_bench"]
