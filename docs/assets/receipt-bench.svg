<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Receipt Bench experiment flow</title>
  <desc id="description">Receipt images and golden answers flow through parallel AI model and document-service paths into quality, latency, and cost evidence.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b33"/>
      <stop offset="1" stop-color="#102d4c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#071b33" flood-opacity=".13"/>
    </filter>
    <path id="flow-a" d="M310 190 C365 190 370 125 425 125"/>
    <path id="flow-b" d="M310 190 C365 190 370 190 425 190"/>
    <path id="flow-c" d="M310 190 C365 190 370 255 425 255"/>
    <path id="flow-out-a" d="M705 125 C760 125 755 190 810 190"/>
    <path id="flow-out-b" d="M705 190 C760 190 755 190 810 190"/>
    <path id="flow-out-c" d="M705 255 C760 255 755 190 810 190"/>
  </defs>

  <rect width="1200" height="360" rx="18" fill="#f5f7fa"/>
  <path d="M0 18Q0 0 18 0h1164q18 0 18 18v74H0z" fill="url(#header)"/>
  <g fill="#fff" font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="45" font-size="27" font-weight="700">Receipt Bench</text>
    <text x="42" y="72" font-size="14" fill="#b6c5d7">Same receipts. Same golden answers. Comparable evidence.</text>
  </g>
  <g transform="translate(1035 27)" fill="none" stroke="#64b5f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 0h24m-20 0v22L2 54a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L40 22V0"/>
    <path d="M12 45h36"/>
    <circle cx="23" cy="51" r="2" fill="#64b5f6" stroke="none"/>
    <circle cx="37" cy="57" r="2" fill="#64b5f6" stroke="none"/>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="42" y="126" width="268" height="128" rx="12" fill="#fff" stroke="#bec7d3"/>
    <rect x="58" y="143" width="80" height="94" rx="7" fill="#f3f6f9" stroke="#0f5cc0"/>
    <path d="M72 162h50M72 174h39M72 186h46M72 208h50M72 220h32" stroke="#596579" stroke-width="4" stroke-linecap="round"/>
    <path d="M152 159h30l10 10v51h-40z" fill="#e8f5ed" stroke="#107c41"/>
    <path d="M182 159v12h12" fill="none" stroke="#107c41"/>
    <path d="m160 193 8 8 17-20" fill="none" stroke="#107c41" stroke-width="3"/>
    <text x="194" y="168" fill="#172033" font-size="15" font-weight="700">Receipts + gold</text>
    <text x="194" y="192" fill="#596579" font-size="12">Images</text>
    <text x="194" y="211" fill="#596579" font-size="12">Schema</text>
    <text x="194" y="230" fill="#596579" font-size="12">Answers</text>

    <rect x="425" y="105" width="280" height="40" rx="8" fill="#cfe4fa" stroke="#0078d4"/>
    <rect x="425" y="170" width="280" height="40" rx="8" fill="#e8daef" stroke="#5c2d91"/>
    <rect x="425" y="235" width="280" height="40" rx="8" fill="#fff4ce" stroke="#f7630c"/>
    <text x="445" y="130" fill="#172033" font-size="13" font-weight="650">Multimodal models</text>
    <text x="445" y="195" fill="#172033" font-size="13" font-weight="650">OCR → structured normalizer</text>
    <text x="445" y="260" fill="#172033" font-size="13" font-weight="650">Native document services</text>
    <text x="688" y="130" fill="#596579" font-size="11" text-anchor="end">parallel</text>
    <text x="688" y="195" fill="#596579" font-size="11" text-anchor="end">parallel</text>
    <text x="688" y="260" fill="#596579" font-size="11" text-anchor="end">parallel</text>

    <rect x="810" y="126" width="348" height="128" rx="12" fill="#fff" stroke="#bec7d3"/>
    <text x="832" y="157" fill="#172033" font-size="15" font-weight="700">Evidence, not a mystery score</text>
    <g font-size="12" font-weight="650">
      <rect x="832" y="175" width="88" height="38" rx="7" fill="#e8f5ed"/>
      <text x="849" y="199" fill="#107c41">Quality</text>
      <rect x="930" y="175" width="88" height="38" rx="7" fill="#cfe4fa"/>
      <text x="947" y="199" fill="#0f5cc0">Latency</text>
      <rect x="1028" y="175" width="108" height="38" rx="7" fill="#fff4ce"/>
      <text x="1050" y="199" fill="#7a4700">Cost</text>
    </g>
    <text x="832" y="235" fill="#596579" font-size="11">Every aggregate links back to receipt-level output.</text>
  </g>

  <g fill="none" stroke="#8da2ba" stroke-width="2">
    <use href="#flow-a"/>
    <use href="#flow-b"/>
    <use href="#flow-c"/>
    <use href="#flow-out-a"/>
    <use href="#flow-out-b"/>
    <use href="#flow-out-c"/>
  </g>
  <g fill="#0f5cc0">
    <circle r="4"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#flow-a"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.4s" begin=".7s" repeatCount="indefinite"><mpath href="#flow-b"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.4s" begin="1.4s" repeatCount="indefinite"><mpath href="#flow-c"/></animateMotion></circle>
  </g>
  <g fill="#107c41">
    <circle r="4"><animateMotion dur="3.4s" begin="1.1s" repeatCount="indefinite"><mpath href="#flow-out-a"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#flow-out-b"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.4s" begin="2.5s" repeatCount="indefinite"><mpath href="#flow-out-c"/></animateMotion></circle>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#737f90">
    <text x="43" y="324">PIN</text>
    <text x="79" y="324" fill="#172033" font-weight="650">dataset · schema · prompt · pricing</text>
    <path d="M309 320h564" stroke="#dfe4eb"/>
    <text x="892" y="324">INSPECT</text>
    <text x="953" y="324" fill="#172033" font-weight="650">raw · parsed · telemetry</text>
  </g>
</svg>
